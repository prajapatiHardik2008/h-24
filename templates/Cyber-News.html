<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-24 | News Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff41;
            --bg: #0a0a0a;
            --border: #1a1a1a;
            --header-bg: #111;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Information Header */
        .intel-header {
            width: 100%;
            background: var(--header-bg);
            border-bottom: 2px solid var(--neon);
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        .intel-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            margin: 0;
            color: var(--neon);
            letter-spacing: 5px;
        }

        .intel-header p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        /* Main News Box (The Terminal) */
        .news-terminal {
            width: 80%;
            max-width: 800px;
            height: 400px;
            margin-top: 50px;
            background: #0d0d0d;
            border: 1px solid var(--border);
            padding: 30px;
            position: relative;
            box-sizing: border-box;
            border-left: 4px solid var(--neon);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Empty State Styling (JS will fill this) */
        #news-content {
            color: #eee;
            font-size: 18px;
            line-height: 1.6;
        }

        #news-content:empty::before {
            content: "INITIALIZING CONNECTION... WAITING FOR INTEL_DATA_STREAM";
            color: #444;
            font-style: italic;
        }

        /* Button Container */
        .nav-controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        /* Professional Buttons */
        .btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 12px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 20px var(--neon);
        }

        .btn-home {
            border-color: #888;
            color: #888;
        }

        .btn-home:hover {
            background: #888;
            color: black;
            box-shadow: 0 0 20px #888;
        }

        /* Scanning Line Animation */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: absolute;
            top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        #news-content pre {
    color: #00ff41;
    background: rgba(0, 0, 0, 0.8);
    padding: 20px;
    
    /* Ye teen lines zaroori hain responsive banane ke liye */
    white-space: pre-wrap;       /* Text wrap hoga, bahar nahi jayega */
    word-wrap: break-word;       /* Lambe words break ho jayenge */
    overflow-x: hidden;          /* Horizontal scroll hatane ke liye */
    
    border: 1px solid #00ff41;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    max-width: 100%;             /* Card ki width se bahar nahi jayega */
}

/* Mobile ke liye font thoda chota kar do */
@media (max-width: 600px) {
    #news-content pre {
        font-size: 12px;
        padding: 10px;
    }
}
    </style>
</head>
<body>

    <div class="intel-header">
        <h1>H-24 INTEL_FEED</h1>
        <p>Hardik Prajapati | Security Analyst | LJ University</p>
    </div>

    <div class="news-terminal">
        <div class="scanline"></div>
        <div id="news-content">
            </div>
    </div>

    <div class="nav-controls">
        <a href="/" class="btn btn-home">Back to Home</a>
        <button id="next-btn" class="btn">Next News ></button>
    </div><script type="module" src="{{ url_for('static', filename='news.js') }}"></script>
</body>
</html>
