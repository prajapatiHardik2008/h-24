<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Strength Checker</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='passst.css') }}">

    <!-- FontAwesome for eye icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card">
        <h2>Password Security</h2>
        <p class="subtitle">Check your password strength in real-time</p>

        <div class="input-container">
            <input type="password" id="password" placeholder="Enter your password..." autocomplete="new-password">
            <span id="toggle-btn"><i class="fa-solid fa-eye" id="eye-icon"></i></span>
        </div>

        <div class="strength-meter">
            <div id="meter-bar"></div>
        </div>
        <p id="strength-text">Strength: <span>Too weak</span></p>

        <ul class="requirements">
            <li id="length" class="invalid"><i class="fa-solid fa-circle-xmark"></i> At least 8 characters</li>
            <li id="uppercase" class="invalid"><i class="fa-solid fa-circle-xmark"></i> At least one uppercase letter</li>
            <li id="number" class="invalid"><i class="fa-solid fa-circle-xmark"></i> At least one number</li>
            <li id="special" class="invalid"><i class="fa-solid fa-circle-xmark"></i> At least one special character</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
